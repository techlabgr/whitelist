<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a73e8">
<title>To Do</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1a73e8;
    --primary-dark: #1557b0;
    --primary-light: #e8f0fe;
    --surface: #ffffff;
    --bg: #f6f8fc;
    --on-surface: #202124;
    --on-surface-variant: #5f6368;
    --outline: #dadce0;
    --danger: #d93025;
    --success: #1e8e3e;
    --radius-lg: 28px;
    --radius-md: 16px;
    --radius-sm: 12px;
    --shadow-1: 0 1px 2px rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15);
    --shadow-2: 0 1px 3px rgba(60,64,67,.3), 0 4px 8px 3px rgba(60,64,67,.15);
    --shadow-fab: 0 3px 5px rgba(60,64,67,.3), 0 6px 10px 4px rgba(60,64,67,.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Nunito', 'Google Sans', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--on-surface);
    min-height: 100vh;
    line-height: 1.5;
  }

  /* ---------- Top App Bar ---------- */
  .app-bar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--primary);
    color: #fff;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow-1);
  }
  .app-bar h1 {
    font-size: 1.375rem;
    font-weight: 700;
    letter-spacing: .3px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .app-bar .logo {
    width: 30px; height: 30px;
    display: grid; place-items: center;
    background: rgba(255,255,255,.18);
    border-radius: 8px;
  }
  .badge {
    background: #fff;
    color: var(--primary);
    font-size: .8rem;
    font-weight: 800;
    min-width: 30px;
    height: 30px;
    padding: 0 10px;
    border-radius: 15px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform .25s cubic-bezier(.2,0,0,1);
  }
  .badge.bump { transform: scale(1.25); }

  /* ---------- Layout ---------- */
  .container {
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 16px 120px;
  }

  /* ---------- Add task card ---------- */
  .add-card {
    background: var(--surface);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-1);
    padding: 8px 8px 8px 20px;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
    transition: box-shadow .2s ease;
  }
  .add-card:focus-within { box-shadow: var(--shadow-2); }
  .add-card input {
    flex: 1;
    border: none;
    outline: none;
    font: inherit;
    font-size: 1.05rem;
    background: transparent;
    color: var(--on-surface);
    padding: 12px 0;
  }
  .add-card input::placeholder { color: var(--on-surface-variant); }

  /* ---------- Buttons / ripple ---------- */
  .btn {
    position: relative;
    overflow: hidden;
    border: none;
    cursor: pointer;
    font: inherit;
    user-select: none;
  }
  .btn-add {
    background: var(--primary);
    color: #fff;
    font-weight: 700;
    font-size: .95rem;
    padding: 12px 22px;
    border-radius: var(--radius-sm);
    transition: background .2s, box-shadow .2s;
  }
  .btn-add:hover { background: var(--primary-dark); box-shadow: var(--shadow-1); }
  .btn-add:active { transform: scale(.97); }

  .ripple {
    position: absolute;
    border-radius: 50%;
    transform: scale(0);
    background: rgba(255,255,255,.5);
    animation: ripple .6s linear;
    pointer-events: none;
  }
  @keyframes ripple { to { transform: scale(2.6); opacity: 0; } }

  /* ---------- Filter chips ---------- */
  .filters {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .chip {
    position: relative;
    overflow: hidden;
    border: 1px solid var(--outline);
    background: var(--surface);
    color: var(--on-surface-variant);
    padding: 8px 18px;
    border-radius: 20px;
    font: inherit;
    font-weight: 600;
    font-size: .9rem;
    cursor: pointer;
    transition: all .2s ease;
  }
  .chip:hover { background: #f1f3f4; }
  .chip.active {
    background: var(--primary-light);
    color: var(--primary);
    border-color: var(--primary-light);
  }
  .chip.active::before {
    content: '✓';
    margin-right: 6px;
    font-weight: 800;
  }

  /* ---------- Task list ---------- */
  .task-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }

  .task {
    background: var(--surface);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-1);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    animation: slideIn .35s cubic-bezier(.2,0,0,1);
    transition: box-shadow .2s, transform .2s, opacity .3s;
  }
  .task:hover { box-shadow: var(--shadow-2); }
  .task.removing {
    opacity: 0;
    transform: translateX(40px) scale(.96);
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* checkbox */
  .checkbox {
    flex-shrink: 0;
    width: 24px; height: 24px;
    border: 2px solid var(--on-surface-variant);
    border-radius: 50%;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: background .25s, border-color .25s, transform .15s;
  }
  .checkbox:active { transform: scale(.85); }
  .checkbox svg {
    width: 14px; height: 14px;
    stroke: #fff;
    stroke-width: 3.5;
    fill: none;
    stroke-dasharray: 20;
    stroke-dashoffset: 20;
    transition: stroke-dashoffset .3s ease .05s;
  }
  .task.done .checkbox {
    background: var(--success);
    border-color: var(--success);
  }
  .task.done .checkbox svg { stroke-dashoffset: 0; }

  .task-text {
    flex: 1;
    font-size: 1.02rem;
    word-break: break-word;
    transition: color .3s, opacity .3s;
  }
  .task.done .task-text {
    color: var(--on-surface-variant);
    opacity: .6;
    text-decoration: line-through;
  }

  .delete-btn {
    flex-shrink: 0;
    background: transparent;
    border: none;
    cursor: pointer;
    color: var(--on-surface-variant);
    width: 38px; height: 38px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    transition: background .2s, color .2s;
  }
  .delete-btn:hover { background: #fce8e6; color: var(--danger); }
  .delete-btn svg { width: 20px; height: 20px; }

  /* ---------- Footer / counter ---------- */
  .list-footer {
    margin-top: 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--on-surface-variant);
    font-size: .9rem;
    font-weight: 600;
    padding: 0 4px;
  }
  .clear-done {
    background: none;
    border: none;
    color: var(--primary);
    font: inherit;
    font-weight: 700;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 8px;
    transition: background .2s;
  }
  .clear-done:hover { background: var(--primary-light); }
  .clear-done:disabled { color: var(--outline); cursor: default; background: none; }

  /* ---------- Empty state ---------- */
  .empty {
    text-align: center;
    padding: 56px 20px;
    color: var(--on-surface-variant);
    animation: slideIn .4s ease;
  }
  .empty svg { width: 120px; height: 120px; opacity: .9; margin-bottom: 16px; }
  .empty h2 { font-size: 1.2rem; font-weight: 700; color: var(--on-surface); margin-bottom: 6px; }
  .empty p { font-size: .95rem; }

  /* ---------- FAB ---------- */
  .fab {
    position: fixed;
    right: 20px;
    bottom: 24px;
    width: 60px; height: 60px;
    border-radius: 18px;
    background: var(--primary);
    color: #fff;
    border: none;
    cursor: pointer;
    box-shadow: var(--shadow-fab);
    display: none;
    place-items: center;
    z-index: 20;
    overflow: hidden;
    transition: background .2s, transform .15s;
  }
  .fab:active { transform: scale(.92); }
  .fab svg { width: 28px; height: 28px; }

  @media (max-width: 600px) {
    .btn-add .label { display: none; }
    .btn-add { padding: 12px; border-radius: 50%; }
    .fab { display: grid; }
    .container { padding-bottom: 110px; }
  }

  .hidden { display: none !important; }
</style>
</head>
<body>
  <header class="app-bar">
    <h1>
      <span class="logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      </span>
      To&nbsp;Do
    </h1>
    <span class="badge" id="badge">0</span>
  </header>

  <main class="container">
    <form class="add-card" id="add-form">
      <input type="text" id="task-input" placeholder="Add a new task…" autocomplete="off" maxlength="200">
      <button type="submit" class="btn btn-add" aria-label="Add task">
        <span class="label">Add</span>
        <svg class="icon-only" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" style="display:none"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </form>

    <div class="filters" id="filters">
      <button class="chip active" data-filter="all">All</button>
      <button class="chip" data-filter="active">Active</button>
      <button class="chip" data-filter="completed">Completed</button>
    </div>

    <ul class="task-list" id="task-list"></ul>

    <div class="empty hidden" id="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1a73e8" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18"/><path d="M8 14l2.5 2.5L16 11" stroke="#1a73e8" stroke-width="1.6"/></svg>
      <h2>All clear!</h2>
      <p id="empty-msg">Add your first task to get started.</p>
    </div>

    <div class="list-footer" id="footer">
      <span id="counter">0 tasks left</span>
      <button class="clear-done" id="clear-done">Clear completed</button>
    </div>
  </main>

  <button class="fab btn" id="fab" aria-label="Add task">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

<script>
(function () {
  'use strict';

  const STORAGE_KEY = 'material-todo.tasks.v1';
  const $ = (id) => document.getElementById(id);

  const form     = $('add-form');
  const input    = $('task-input');
  const listEl   = $('task-list');
  const emptyEl  = $('empty');
  const emptyMsg = $('empty-msg');
  const footer   = $('footer');
  const counter  = $('counter');
  const badge    = $('badge');
  const clearBtn = $('clear-done');
  const filtersEl= $('filters');
  const fab      = $('fab');

  let tasks  = load();
  let filter = 'all';

  /* ---------- persistence ---------- */
  function load() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch (e) { return []; }
  }
  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  }

  /* ---------- ripple effect ---------- */
  function addRipple(e) {
    const btn = e.currentTarget;
    const circle = document.createElement('span');
    const d = Math.max(btn.clientWidth, btn.clientHeight);
    const rect = btn.getBoundingClientRect();
    circle.className = 'ripple';
    circle.style.width = circle.style.height = d + 'px';
    circle.style.left = (e.clientX - rect.left - d / 2) + 'px';
    circle.style.top  = (e.clientY - rect.top  - d / 2) + 'px';
    btn.appendChild(circle);
    setTimeout(() => circle.remove(), 600);
  }
  document.querySelectorAll('.btn, .chip').forEach(b => b.addEventListener('click', addRipple));

  /* ---------- rendering ---------- */
  function visibleTasks() {
    if (filter === 'active')    return tasks.filter(t => !t.done);
    if (filter === 'completed') return tasks.filter(t => t.done);
    return tasks;
  }

  function render() {
    listEl.innerHTML = '';
    const visible = visibleTasks();

    visible.forEach(task => listEl.appendChild(makeTaskEl(task)));

    // empty state
    if (tasks.length === 0) {
      emptyEl.classList.remove('hidden');
      emptyMsg.textContent = 'Add your first task to get started.';
      footer.classList.add('hidden');
    } else if (visible.length === 0) {
      emptyEl.classList.remove('hidden');
      emptyMsg.textContent = filter === 'completed'
        ? 'No completed tasks yet.'
        : 'Nothing active — great job!';
      footer.classList.remove('hidden');
    } else {
      emptyEl.classList.add('hidden');
      footer.classList.remove('hidden');
    }

    updateCounts();
  }

  function makeTaskEl(task) {
    const li = document.createElement('li');
    li.className = 'task' + (task.done ? ' done' : '');
    li.dataset.id = task.id;

    const box = document.createElement('button');
    box.className = 'checkbox';
    box.setAttribute('aria-label', task.done ? 'Mark as active' : 'Mark as complete');
    box.innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>';
    box.addEventListener('click', () => toggle(task.id));

    const text = document.createElement('span');
    text.className = 'task-text';
    text.textContent = task.text;

    const del = document.createElement('button');
    del.className = 'delete-btn';
    del.setAttribute('aria-label', 'Delete task');
    del.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M10 11v6M14 11v6"/></svg>';
    del.addEventListener('click', () => remove(task.id, li));

    li.append(box, text, del);
    return li;
  }

  function updateCounts() {
    const left = tasks.filter(t => !t.done).length;
    const done = tasks.length - left;
    counter.textContent = left + (left === 1 ? ' task left' : ' tasks left');
    clearBtn.disabled = done === 0;

    badge.textContent = left;
    badge.classList.add('bump');
    setTimeout(() => badge.classList.remove('bump'), 250);
  }

  /* ---------- actions ---------- */
  function add(text) {
    text = text.trim();
    if (!text) return;
    tasks.unshift({ id: Date.now() + '-' + Math.random().toString(36).slice(2, 7), text, done: false });
    save();
    render();
  }

  function toggle(id) {
    const t = tasks.find(t => t.id === id);
    if (!t) return;
    t.done = !t.done;
    save();
    render();
  }

  function remove(id, li) {
    li.classList.add('removing');
    setTimeout(() => {
      tasks = tasks.filter(t => t.id !== id);
      save();
      render();
    }, 280);
  }

  function clearCompleted() {
    const items = [...listEl.querySelectorAll('.task.done')];
    items.forEach(el => el.classList.add('removing'));
    setTimeout(() => {
      tasks = tasks.filter(t => !t.done);
      save();
      render();
    }, items.length ? 280 : 0);
  }

  /* ---------- events ---------- */
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    add(input.value);
    input.value = '';
    input.focus();
  });

  clearBtn.addEventListener('click', clearCompleted);

  filtersEl.addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    filter = chip.dataset.filter;
    filtersEl.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === chip));
    render();
  });

  fab.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
    input.focus();
  });

  render();
})();
</script>
</body>
</html>
